<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="0; url=EzPTable.html">
<title>EzPTable · Redirecting…</title>
<style>
    :root {
        --surface: #E7E5E4;
        --text: #1E2938;
        --text-secondary: #5a6272;
        --primary: #0033CC;
        --shadow-dark: rgba(0, 0, 0, 0.12);
        --shadow-light: rgba(255, 255, 255, 0.9);
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --surface: #1e1e1e;
            --text: #e5e5e5;
            --text-secondary: #a3a3a3;
            --shadow-dark: rgba(0, 0, 0, 0.6);
            --shadow-light: rgba(255, 255, 255, 0.04);
            --primary: #4A7AFF;
        }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        background: var(--surface);
        color: var(--text);
        font-family: "Helvetica Neue", Helvetica, Arial,
            "PingFang SC", "Hiragino Sans GB",
            "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
    }
    .card {
        background: var(--surface);
        border-radius: 24px;
        padding: 40px 36px;
        max-width: 380px;
        width: 100%;
        text-align: center;
        box-shadow:
            12px 12px 28px var(--shadow-dark),
            -12px -12px 28px var(--shadow-light);
        animation: fadeIn 0.5s cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
    }
    .spinner {
        width: 44px;
        height: 44px;
        margin: 0 auto 22px;
        border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: var(--primary);
        border-right-color: var(--primary);
        animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    .title {
        font-size: 1.05rem;
        font-weight: 700;
        margin-bottom: 8px;
        color: var(--text);
        letter-spacing: 0.01em;
    }
    .subtitle {
        font-size: 0.85rem;
        color: var(--text-secondary);
        line-height: 1.6;
        margin-bottom: 24px;
    }
    .btn {
        display: inline-block;
        padding: 10px 24px;
        border-radius: 40px;
        background: var(--surface);
        color: var(--primary);
        font-size: 0.82rem;
        font-weight: 700;
        text-decoration: none;
        box-shadow:
            4px 4px 10px var(--shadow-dark),
            -4px -4px 10px var(--shadow-light);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        -webkit-tap-highlight-color: transparent;
    }
    .btn:hover {
        transform: translateY(-2px);
        box-shadow:
            6px 6px 14px var(--shadow-dark),
            -6px -6px 14px var(--shadow-light);
    }
    .btn:active {
        transform: translateY(0);
        box-shadow:
            inset 3px 3px 8px var(--shadow-dark),
            inset -3px -3px 8px var(--shadow-light);
    }
    .brand {
        margin-top: 26px;
        font-size: 0.65rem;
        color: var(--text-secondary);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.7;
    }
</style>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <div class="title" id="title">正在跳转…</div>
        <div class="subtitle" id="subtitle">即将进入元素周期表</div>
        <a class="btn" id="btn" href="EzPTable.html">点此进入 →</a>
        <div class="brand">EzPTable</div>
    </div>

    <script>
        (function () {
            const I18N = {
                'zh-CN': {
                    title: '正在跳转…',
                    subtitle: '即将进入元素周期表',
                    btn: '点此进入 →',
                    html: '<a href="EzPTable.html">若未自动跳转，请点击此处</a>'
                },
                'zh-TW': {
                    title: '正在跳轉…',
                    subtitle: '即將進入元素週期表',
                    btn: '點此進入 →',
                    html: '<a href="EzPTable.html">若未自動跳轉，請點擊此處</a>'
                },
                'en': {
                    title: 'Redirecting…',
                    subtitle: 'Taking you to the periodic table',
                    btn: 'Enter →',
                    html: '<a href="EzPTable.html">Click here if not redirected</a>'
                },
                'ja': {
                    title: 'リダイレクト中…',
                    subtitle: '周期表へ移動します',
                    btn: 'こちらから →',
                    html: '<a href="EzPTable.html">自動で移動しない場合はこちら</a>'
                }
            };

            function detectLang() {
                const langs = navigator.languages || [navigator.language || 'en'];
                for (const raw of langs) {
                    const l = raw.toLowerCase();
                    if (l.startsWith('zh-tw') || l.startsWith('zh-hk') || l.startsWith('zh-hant')) return 'zh-TW';
                    if (l.startsWith('zh')) return 'zh-CN';
                    if (l.startsWith('ja')) return 'ja';
                    if (l.startsWith('en')) return 'en';
                }
                return 'en';
            }

            const lang = detectLang();
            const t = I18N[lang];
            document.documentElement.lang = lang;
            document.getElementById('title').textContent = t.title;
            document.getElementById('subtitle').textContent = t.subtitle;
            document.getElementById('btn').textContent = t.btn;

            // 若 meta refresh 因某些浏览器未生效，这里再做一次保底跳转
            setTimeout(() => {
                window.location.replace('EzPTable.html');
            }, 300);
        })();
    </script>
</body>
</html>
