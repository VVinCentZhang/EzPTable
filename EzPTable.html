<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0, viewport-fit=cover">
    <title>元素周期表 · 新拟态+玻璃</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --surface: #E7E5E4;
            --text: #1E2938;
            --text-secondary: #5a6272;
            --primary: #0033CC;
            --shadow-dark: rgba(0, 0, 0, 0.12);
            --shadow-light: rgba(255, 255, 255, 0.9);
            --shadow-inset-dark: rgba(0, 0, 0, 0.08);
            --shadow-inset-light: rgba(255, 255, 255, 0.95);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font-mono: 'Space Mono', 'Courier New', monospace;
            --font-sans: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Heiti SC", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
            --cat-alkali-metal: #f2e4e6;
            --cat-alkaline-earth: #f2ebe2;
            --cat-transition-metal: #e2e8f2;
            --cat-post-transition: #e0f0ee;
            --cat-metalloid: #e4f0e0;
            --cat-nonmetal: #eef2e0;
            --cat-halogen: #ece0f0;
            --cat-noble-gas: #e8e8e8;
            --cat-lanthanide: #f0e2ec;
            --cat-actinide: #f0e2e6;
            --card-size: 58px;
            --card-gap: 3px;
            --pointer-x: 50%;
            --pointer-y: 50%;
            --pointer-from-left: 0.5;
            --pointer-from-top: 0.5;
            --glare-opacity: 0;
            --phase-solid: #10B981;
            --phase-liquid: #3B82F6;
            --phase-gas: #EF4444;
            --phase-unknown: #9CA3AF;
            --glass-bg-opacity: 0.25;
            --glass-border-opacity: 0.35;
            --glass-blur: 12;
            --glass-shadow-opacity: 0.12;
            --uncommon-ox: #c0844a;

            --phase-solid-card-bg: #ECFDF5;
            --phase-solid-card-text: #065F46;
            --phase-solid-card-border: #A7F3D0;
            --phase-liquid-card-bg: #EFF6FF;
            --phase-liquid-card-text: #1E3A5F;
            --phase-liquid-card-border: #BFDBFE;
            --phase-gas-card-bg: #FEF2F2;
            --phase-gas-card-text: #991B1B;
            --phase-gas-card-border: #FECACA;
            --phase-unknown-card-bg: #F3F4F6;
            --phase-unknown-card-text: #4B5563;
            --phase-unknown-card-border: #D1D5DB;
        }

        [data-theme="dark"] {
            --surface: #1e1e1e;
            --text: #e5e5e5;
            --text-secondary: #a3a3a3;
            --shadow-dark: rgba(0, 0, 0, 0.6);
            --shadow-light: rgba(255, 255, 255, 0.04);
            --shadow-inset-dark: rgba(0, 0, 0, 0.5);
            --shadow-inset-light: rgba(255, 255, 255, 0.03);
            --primary: #4A7AFF;
            --cat-alkali-metal: #2a1a1a;
            --cat-alkaline-earth: #2a221a;
            --cat-transition-metal: #1a1a2a;
            --cat-post-transition: #1a2a2a;
            --cat-metalloid: #1a2a1a;
            --cat-nonmetal: #2a2a1a;
            --cat-halogen: #2a1a2a;
            --cat-noble-gas: #222222;
            --cat-lanthanide: #2a1a22;
            --cat-actinide: #2a1a1a;
            --phase-solid: #34D399;
            --phase-liquid: #60A5FA;
            --phase-gas: #F87171;
            --phase-unknown: #9CA3AF;
            --glass-bg-opacity: 0.06;
            --glass-border-opacity: 0.12;
            --glass-shadow-opacity: 0.3;
            --uncommon-ox: #e3b77c;

            --phase-solid-card-bg: #0d2818;
            --phase-solid-card-text: #6ee7b7;
            --phase-solid-card-border: #065f46;
            --phase-liquid-card-bg: #0c1b33;
            --phase-liquid-card-text: #93c5fd;
            --phase-liquid-card-border: #1e3a5f;
            --phase-gas-card-bg: #2b1010;
            --phase-gas-card-text: #fca5a5;
            --phase-gas-card-border: #7f1d1d;
            --phase-unknown-card-bg: #1a1a1a;
            --phase-unknown-card-text: #d1d5db;
            --phase-unknown-card-border: #4b5563;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--surface);
            font-family: var(--font-sans);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 12px 40px;
            user-select: none;
            -webkit-user-select: none;
            transition: background 0.3s, color 0.3s;
            background-image: radial-gradient(ellipse at 20% 20%, rgba(0, 51, 204, 0.03) 0%, transparent 60%), radial-gradient(ellipse at 80% 70%, rgba(0, 51, 204, 0.02) 0%, transparent 60%);
        }
        [data-theme="dark"] body {
            background-image: radial-gradient(ellipse at 20% 20%, rgba(74, 122, 255, 0.06) 0%, transparent 60%), radial-gradient(ellipse at 80% 70%, rgba(74, 122, 255, 0.04) 0%, transparent 60%);
        }
        .main-container {
            width: 100%;
            max-width: 1300px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .header-title {
            font-weight: 700;
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-sans);
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .icon-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
        }
        .search-wrapper {
            position: relative;
        }
        .search-input {
            background: var(--surface);
            border: none;
            border-radius: 40px;
            padding: 10px 18px 10px 40px;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            color: var(--text);
            box-shadow: inset 4px 4px 8px var(--shadow-inset-dark), inset -4px -4px 8px var(--shadow-inset-light);
            width: 180px;
            outline: none;
            transition: all var(--transition-smooth);
        }
        .search-input:focus-visible {
            width: 220px;
            box-shadow: inset 4px 4px 8px var(--shadow-inset-dark), inset -4px -4px 8px var(--shadow-inset-light), 0 0 0 3px rgba(0, 51, 204, 0.25);
        }
        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }
        .search-clear {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 1rem;
            padding: 4px 8px;
            border-radius: 50%;
            display: none;
        }
        .search-clear.visible {
            display: block;
        }
        .search-results-count {
            font-size: 0.7rem;
            color: var(--text-secondary);
            min-width: 50px;
            text-align: right;
            opacity: 0;
        }
        .search-results-count.visible {
            opacity: 1;
        }

        .lang-theme-bar {
            position: relative;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 6px;
            border-radius: 40px;
            background: rgba(255, 255, 255, var(--glass-bg-opacity));
            backdrop-filter: blur(calc(var(--glass-blur) * 1px));
            -webkit-backdrop-filter: blur(calc(var(--glass-blur) * 1px));
            border: 1px solid rgba(255, 255, 255, var(--glass-border-opacity));
            box-shadow: 0 8px 32px rgba(0, 0, 0, var(--glass-shadow-opacity)), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transition: all 0.3s;
            overflow: visible;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }
        .lang-slider {
            position: absolute;
            top: 4px;
            bottom: 4px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.5);
            transition: left 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 0;
            overflow: hidden;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
            will-change: left, width;
        }
        .lang-slider::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.6) 0%, transparent 40%, rgba(255, 255, 255, 0.2) 60%, transparent 100%);
            animation: sliderShine 3s ease-in-out infinite alternate;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }
        @keyframes sliderShine {
            0% {
                transform: translateX(-100%) scaleX(1.5);
                opacity: 0.3;
            }
            100% {
                transform: translateX(100%) scaleX(1.5);
                opacity: 0.6;
            }
        }
        [data-theme="dark"] .lang-slider {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.1);
        }
        [data-theme="dark"] .lang-slider::before {
            animation: none !important;
            opacity: 0 !important;
            background: transparent !important;
        }
        .lang-btn {
            position: relative;
            z-index: 1;
            background: transparent;
            border: none;
            border-radius: 30px;
            padding: 5px 14px;
            font-family: var(--font-sans);
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
            line-height: 1.6;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
            letter-spacing: 0.02em;
            -webkit-tap-highlight-color: transparent;
        }
        .lang-btn.active {
            color: var(--primary);
            text-shadow: 0 0 12px rgba(0, 51, 204, 0.2), 0 1px 4px rgba(0, 0, 0, 0.1);
            font-weight: 700;
            transform: scale(1.05);
        }
        .lang-btn:hover:not(.active) {
            color: var(--text);
            transform: scale(1.02);
        }
        [data-theme="dark"] .lang-btn {
            color: rgba(255, 255, 255, 0.7);
        }
        [data-theme="dark"] .lang-btn.active {
            color: #4A7AFF;
            text-shadow: 0 0 16px rgba(74, 122, 255, 0.4), 0 1px 6px rgba(0, 0, 0, 0.5);
        }
        [data-theme="dark"] .lang-btn:hover:not(.active) {
            color: #fff;
        }
        .theme-btn {
            background: transparent;
            border: none;
            border-radius: 30px;
            padding: 4px 10px;
            font-size: 1rem;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.3s;
            line-height: 1.6;
            position: relative;
            z-index: 1;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
            -webkit-tap-highlight-color: transparent;
        }
        .theme-btn:hover {
            color: var(--text);
            transform: scale(1.1);
        }
        [data-theme="dark"] .theme-btn {
            color: rgba(255, 255, 255, 0.7);
        }
        [data-theme="dark"] .theme-btn:hover {
            color: #fff;
        }

        .temp-panel {
            background: var(--surface);
            border-radius: 20px;
            padding: 14px 22px;
            box-shadow: 6px 6px 14px var(--shadow-dark), -6px -6px 14px var(--shadow-light);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px;
            transition: background 0.3s, box-shadow 0.3s;
        }
        .temp-icon {
            font-size: 1.4rem;
            color: var(--text-secondary);
            position: relative;
            z-index: 1;
            width: 2em;
            text-align: center;
            transition: color 0.3s;
        }
        .temp-slider-wrap {
            flex: 1;
            min-width: 200px;
            position: relative;
            z-index: 1;
        }
        .temp-slider {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: var(--surface);
            box-shadow: inset 2px 2px 4px var(--shadow-inset-dark), inset -2px -2px 4px var(--shadow-inset-light);
            -webkit-appearance: none;
            appearance: none;
            outline: none;
            transition: all 0.3s;
        }
        .temp-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--surface);
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        .temp-slider::-webkit-slider-thumb:hover {
            transform: scale(1.12);
        }
        .temp-slider::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--surface);
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        [data-theme="dark"] .temp-slider {
            background: var(--surface);
            box-shadow: inset 2px 2px 4px var(--shadow-inset-dark), inset -2px -2px 4px var(--shadow-inset-light);
        }
        [data-theme="dark"] .temp-slider::-webkit-slider-thumb {
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
            border-color: rgba(255, 255, 255, 0.1);
        }
        .temp-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.5rem;
            color: var(--text-secondary);
            margin-top: 4px;
            opacity: 0.7;
        }
        .temp-display {
            text-align: center;
            min-width: 70px;
            position: relative;
            z-index: 1;
        }
        .temp-value-main {
            font-weight: 700;
            font-size: 1.2rem;
            transition: color 0.15s;
            font-family: var(--font-mono);
        }
        .temp-value-sub {
            font-size: 0.65rem;
            color: var(--text-secondary);
            transition: color 0.15s;
            font-family: var(--font-mono);
        }
        .temp-btn {
            background: var(--surface);
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--text);
            box-shadow: 3px 3px 7px var(--shadow-dark), -3px -3px 7px var(--shadow-light);
            transition: all var(--transition-smooth);
            font-family: var(--font-sans);
            position: relative;
            z-index: 1;
            -webkit-tap-highlight-color: transparent;
        }
        .temp-btn:active {
            box-shadow: inset 3px 3px 6px var(--shadow-inset-dark), inset -3px -3px 6px var(--shadow-inset-light);
        }
        .mode-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
            position: relative;
            z-index: 1;
        }
        .mode-toggle-label {
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--text-secondary);
            font-family: var(--font-sans);
        }
        .mode-toggle-switch {
            width: 44px;
            height: 24px;
            background: var(--surface);
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            box-shadow: inset 2px 2px 4px var(--shadow-inset-dark), inset -2px -2px 4px var(--shadow-inset-light);
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .mode-toggle-switch.active {
            background: var(--primary);
        }
        .mode-toggle-switch::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: transform 0.2s;
            box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        .mode-toggle-switch.active::after {
            transform: translateX(20px);
        }
        .phase-legend-wrap {
            background: var(--surface);
            border-radius: 16px;
            padding: 8px 16px;
            box-shadow: inset 3px 3px 8px var(--shadow-inset-dark), inset -3px -3px 8px var(--shadow-inset-light);
            display: flex;
            align-items: center;
            gap: 12px 20px;
            flex-wrap: wrap;
            font-size: 0.65rem;
            transition: background 0.3s;
        }
        .phase-legend-label {
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            font-size: 0.6rem;
            font-family: var(--font-sans);
        }
        .phase-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 500;
            color: var(--text);
            font-family: var(--font-sans);
        }
        .phase-dot-sample {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
        }
        .phase-item.solid .phase-dot-sample {
            background: var(--phase-solid);
        }
        .phase-item.liquid .phase-dot-sample {
            background: var(--phase-liquid);
        }
        .phase-item.gas .phase-dot-sample {
            background: var(--phase-gas);
        }
        .phase-item.unknown .phase-dot-sample {
            background: var(--phase-unknown);
        }
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .legend-label {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            font-family: var(--font-sans);
        }
        .legend-chip {
            padding: 6px 14px;
            border-radius: 24px;
            font-size: 0.65rem;
            font-weight: 500;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all var(--transition-smooth);
            white-space: nowrap;
            box-shadow: 3px 3px 7px var(--shadow-dark), -3px -3px 7px var(--shadow-light);
            background: var(--surface);
            color: var(--text);
            font-family: var(--font-sans);
            -webkit-tap-highlight-color: transparent;
        }
        .legend-chip.active {
            box-shadow: inset 3px 3px 6px var(--shadow-inset-dark), inset -3px -3px 6px var(--shadow-inset-light);
            border-color: var(--primary);
            transform: scale(0.97);
        }
        .legend-reset {
            font-size: 0.6rem;
            padding: 6px 14px;
            border-radius: 24px;
            cursor: pointer;
            background: var(--surface);
            border: 2px solid transparent;
            color: var(--text-secondary);
            font-family: var(--font-sans);
            box-shadow: 3px 3px 7px var(--shadow-dark), -3px -3px 7px var(--shadow-light);
            transition: all var(--transition-smooth);
            -webkit-tap-highlight-color: transparent;
        }
        .legend-reset:active {
            box-shadow: inset 3px 3px 6px var(--shadow-inset-dark), inset -3px -3px 6px var(--shadow-inset-light);
        }
        .table-outer-wrapper {
            background: var(--surface);
            border-radius: 24px;
            padding: 16px 10px 20px;
            box-shadow: 10px 10px 24px var(--shadow-dark), -10px -10px 24px var(--shadow-light);
            overflow-x: auto;
            transition: background 0.3s, box-shadow 0.3s;
        }
        .periodic-table {
            display: grid;
            grid-template-columns: repeat(18, var(--card-size));
            grid-template-rows: repeat(9, var(--card-size));
            gap: var(--card-gap);
            justify-content: center;
            width: fit-content;
            margin: 0 auto;
        }
        .element-card {
            position: relative;
            border-radius: 8px;
            cursor: pointer;
            background: var(--card-bg, var(--surface));
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            border: 1.5px solid var(--card-border-color, transparent);
            transition: transform 0.2s ease-out, box-shadow 0.3s, border-color 0.3s, opacity 0.3s, filter 0.3s;
            overflow: hidden;
            font-size: clamp(10px, calc(var(--card-size)/4), 18px);
            font-family: var(--font-sans);
            -webkit-tap-highlight-color: transparent;
        }
        .element-card:hover {
            transform: translateY(-3px);
            box-shadow: 7px 7px 14px var(--shadow-dark), -7px -7px 14px var(--shadow-light);
            border-color: rgba(0, 51, 204, 0.3);
            z-index: 10;
        }
        .element-card:active {
            transform: scale(0.96) translateY(-3px);
            transition: transform 0.12s ease-out;
            box-shadow: 7px 7px 14px var(--shadow-dark), -7px -7px 14px var(--shadow-light);
        }
        @media (prefers-reduced-motion: reduce) {
            .element-card:active {
                transform: translateY(-3px);
                transition: transform 0.05s;
            }
        }
        .element-card.dimmed {
            opacity: 0.35;
            filter: grayscale(0.5);
            pointer-events: none;
        }
        .element-card.highlighted {
            border-color: rgba(0, 51, 204, 0.6);
        }
        .element-card .atomic-number {
            position: absolute;
            top: 0.2em;
            left: 0.3em;
            font-size: 0.7em;
            font-weight: 600;
            color: var(--text-secondary);
            opacity: 0.8;
            line-height: 1;
        }
        .element-card .symbol {
            position: absolute;
            top: 0.2em;
            right: 0.3em;
            font-size: 0.9em;
            font-weight: 700;

            background: rgba(30, 41, 56, 0.45);

            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            transition: opacity 0.35s;

            -webkit-transform: translateZ(0);
            transform: translateZ(0);
            touch-action: auto;

        .modal-card {
            position: relative;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
            display: flex;
            flex-direction: column;
            padding: 24px 20px 20px;
            gap: 14px;
            height: 100%;
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;

            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;

            display: none;

            mix-blend-mode: screen;
            transition: opacity 0.3s ease;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }
        .modal-glare::after {
            content: '';
            position: absolute;
            inset: -20px;
            border-radius: 32px;
            pointer-events: none;

        .modal-close {
            position: absolute;

            font-weight: 600;
            font-family: var(--font-sans);
        }

            vertical-align: super;
            line-height: 1;
        }
        .atom-animation-container {
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--surface);
            border-radius: 16px;
            padding: 10px;
            margin-top: 6px;
            box-shadow: 4px 4px 10px var(--shadow-dark), -4px -4px 10px var(--shadow-light);
            transform: translateZ(6px) translate3d(calc((var(--pointer-from-left) - 0.5) * 3px), calc((var(--pointer-from-top) - 0.5) * 3px), 0);
            -webkit-transform: translateZ(6px) translate3d(calc((var(--pointer-from-left) - 0.5) * 3px), calc((var(--pointer-from-top) - 0.5) * 3px), 0);
        }
        .atom-svg {
            width: 100%;
            max-width: 260px;
            height: auto;
        }
        .orbit {
            transform-origin: 0px 0px;
            -webkit-transform-origin: 0px 0px;
        }
        .orbit-1 {
            animation: spin 3s linear infinite;
        }
        .orbit-2 {
            animation: spin 4s linear infinite reverse;
        }
        .orbit-3 {
            animation: spin 5s linear infinite;
        }
        .orbit-4 {
            animation: spin 6s linear infinite reverse;
        }
        .orbit-5 {
            animation: spin 7s linear infinite;
        }
        .orbit-6 {
            animation: spin 8s linear infinite reverse;
        }
        .orbit-7 {
            animation: spin 9s linear infinite;
        }
        .orbit-8 {
            animation: spin 10s linear infinite reverse;
        }
        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
        @keyframes modalBounceIn {
            0% {
                transform: scale(0.8) translateY(30px);
                opacity: 0;
            }
            60% {
                transform: scale(1.03) translateY(-5px);
                opacity: 1;
            }
            80% {
                transform: scale(0.98) translateY(2px);
            }
            100% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }
        .modal-dialog.bouncing-in {
            animation: modalBounceIn 0.5s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
        }

        @media (max-width: 700px) {
            :root {
                --card-size: 38px;
            }
            .modal-dialog {
                width: 92vw;
                max-height: 90vh;
            }
            .modal-symbol-badge {
                width: 50px;
                height: 50px;
                font-size: 1.4rem;
            }
            .modal-close {
                width: 32px;
                height: 32px;
            }
            .modal-details-grid {
                grid-template-columns: 1fr;
            }
            .atom-svg {
                max-width: 200px;
            }
            .temp-panel {
                gap: 10px;
                padding: 12px 14px;
            }
            .phase-legend-wrap {
                gap: 8px 14px;
                padding: 6px 12px;
                font-size: 0.6rem;
            }
            .legend-chip {
                font-size: 0.55rem;
                padding: 4px 10px;
            }
            .element-card {
                font-size: clamp(8px, calc(var(--card-size)/4.5), 14px);
            }
            .header-actions {
                gap: 8px;
            }
            .lang-btn {
                padding: 2px 10px;
                font-size: 0.6rem;
            }
            .search-input {
                width: 140px;
                font-size: 0.75rem;
                padding: 8px 14px 8px 32px;
            }
            .search-input:focus-visible {
                width: 170px;
            }
            .temp-btn {
                padding: 6px 12px;
                font-size: 0.6rem;
            }
            .mode-toggle-label {
                font-size: 0.6rem;
            }
            .temp-icon {
                font-size: 1.2rem;
            }
        }
        @media (max-width: 450px) {
            :root {
                --card-size: 30px;
            }
            .element-card {
                font-size: clamp(6px, calc(var(--card-size)/4.5), 11px);
            }

            }

            }

                font-size: 0.5em;
            }
            .element-card .phase-dot {
                width: 0.6em;
                height: 0.6em;
            }
        }

</head>
<body>
    <div class="main-container">
        <header class="header">
            <h1 class="header-title" id="headerTitle"><span class="icon-dot"></span>元素周期表</h1>
            <div class="header-actions">
                <div class="search-wrapper">
                    <span class="search-icon">⚲</span>
                    <input type="text" class="search-input" id="searchInput" placeholder="搜索元素..." autocomplete="off">
                    <button class="search-clear" id="searchClear">✕</button>
                </div>
                <span class="search-results-count" id="resultsCount"></span>
                <div class="lang-theme-bar">
                    <span class="lang-slider"></span>
                    <button class="lang-btn active" data-lang="zh">简</button>
                    <button class="lang-btn" data-lang="zh-tw">繁</button>
                    <button class="lang-btn" data-lang="en">EN</button>
                    <button class="lang-btn" data-lang="ja">日</button>
                    <button class="theme-btn" id="themeToggle" title="切换夜间模式">🌙</button>
                </div>
            </div>
        </header>

        <div class="temp-panel">
            <div class="temp-icon" id="tempIcon"><i class="fas fa-thermometer-half"></i></div>
            <div class="temp-slider-wrap">
                <input type="range" class="temp-slider" id="tempSlider" min="-273" max="6000" value="25" step="1">
                <div class="temp-labels"><span>-273°C</span><span>1000°C</span><span>2000°C</span><span>3000°C</span><span>4000°C</span><span>6000°C</span></div>
            </div>
            <div class="temp-display">
                <div class="temp-value-main" id="tempValueMain">25°C</div>
                <div class="temp-value-sub" id="tempValueSub">298 K</div>

            <span class="phase-item gas"><span class="phase-dot-sample"></span><span id="phaseGas">气体</span></span>
            <span class="phase-item unknown"><span class="phase-dot-sample"></span><span id="phaseUnknown">未知</span></span>
        </div>

        <nav class="legend" id="legend">
            <span class="legend-label" id="categoryLabel">分类：</span>
        </nav>

        <div class="table-outer-wrapper">
            <div class="periodic-table" id="periodicTable"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
        <div class="modal-dialog" id="modalDialog">
            <div class="modal-glare" id="modalGlare"></div>
            <div class="modal-card" id="modalCard">

                    'Au': '+1, +3, +5', 'Hg': '+1, +2', 'Rf': '+4', 'Db': '+5', 'Sg': '+6', 'Bh': '+7',
                    'Hs': '+8', 'Mt': '+3, +4, +6', 'Ds': '+2, +4', 'Rg': '+3', 'Cn': '+2'
                };
                const lanthAct = {
                    'La': '+3', 'Ce': '+3, +4', 'Pr': '+3, +4', 'Nd': '+3', 'Pm': '+3', 'Sm': '+2, +3',
                    'Eu': '+2, +3', 'Gd': '+3', 'Tb': '+3, +4', 'Dy': '+3', 'Ho': '+3', 'Er': '+3',
                    'Tm': '+2, +3', 'Yb': '+2, +3', 'Lu': '+3', 'Ac': '+3', 'Th': '+4', 'Pa': '+4, +5',

            function formatEC(ec) {
                const supMap = { '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8',
                    '⁹': '9' };
                return ec.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, m => {
                    let n = '';
                    for (let c of m) n += supMap[c];
                    return '<sup>' + n + '</sup>';

            function getTemperatureColor(tempC) {
                const stops = [{ temp: -273, rgb: [0, 102, 255] }, { temp: 0, rgb: [0, 204, 102] }, { temp: 100,
                    rgb: [255, 153, 0] }, { temp: 1000, rgb: [255, 51, 0] }, { temp: 6000, rgb: [204, 0, 0] }];
                const t = Math.max(-273, Math.min(6000, tempC));
                for (let i = 0; i < stops.length - 1; i++)
                    if (t >= stops[i].temp && t <= stops[i + 1].temp) {
                        const f = (t - stops[i].temp) / (stops[i + 1].temp - stops[i].temp);
                        const r = Math.round(stops[i].rgb[0] + f * (stops[i + 1].rgb[0] - stops[i].rgb[0]));
                        const g = Math.round(stops[i].rgb[1] + f * (stops[i + 1].rgb[1] - stops[i].rgb[1]));
                        const b = Math.round(stops[i].rgb[2] + f * (stops[i + 1].rgb[2] - stops[i].rgb[2]));
                        return `rgb(${r},${g},${b})`;
                    }
                return `rgb(204,0,0)`;
            }

                    'fa-thermometer-three-quarters', 'fa-thermometer-full'];

            function handleOrientation(e) {
                if (!mobileModalActive) return;
                let gamma = e.gamma;
                let beta = e.beta;
                if (gamma == null || beta == null) return;

                const orientation = screen.orientation?.type || '';
                const isLandscape = orientation.startsWith('landscape');
                const currentOrientation = isLandscape ? 'landscape' : 'portrait';

                if (lastScreenOrientation !== null && lastScreenOrientation !== currentOrientation) {
                    needGyroCalibration = true;
                }
                lastScreenOrientation = currentOrientation;

                if (isLandscape) {
                    [gamma, beta] = [beta, gamma];
                    gamma = -gamma;
                }

                if (needGyroCalibration) {
                    gyroBeta0 = beta;
                    gyroGamma0 = gamma;
                    needGyroCalibration = false;
                    gyroAvailable = true;
                    targetMobileRotateX = 0;
                    targetMobileRotateY = 0;
                    targetGlareX = 50;
                    targetGlareY = 50;
                    return;
                }

                if (gyroBeta0 == null || gyroGamma0 == null) return;
                gyroAvailable = true;

                const deltaBeta = beta - gyroBeta0;
                const deltaGamma = gamma - gyroGamma0;
                const maxTilt = 18;
                targetMobileRotateX = Math.max(-maxTilt, Math.min(maxTilt, deltaBeta * 1.0));
                targetMobileRotateY = Math.max(-maxTilt, Math.min(maxTilt, deltaGamma * 1.0));

                if (!isTouching) {
                    targetGlareX = 50 + deltaGamma * 1.0;
                    targetGlareY = 50 + deltaBeta * 1.0;
                    targetGlareX = Math.max(5, Math.min(95, targetGlareX));
                    targetGlareY = Math.max(5, Math.min(95, targetGlareY));
                }
            }

            function enableGyro() {
                if (gyroActive) return;
                if (typeof DeviceOrientationEvent !== 'undefined') {
                    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                        DeviceOrientationEvent.requestPermission().then(state => {
                            if (state === 'granted') {
                                window.addEventListener('deviceorientation', handleOrientation);
                                gyroActive = true;
                            }
                        }).catch(() => {});
                    } else {
                        window.addEventListener('deviceorientation', handleOrientation);
                        gyroActive = true;
                    }
                }
            }

            function handleModalTouchStart(e) {
                if (!mobileModalActive) return;
                isTouching = true;
                if (e.touches.length === 1) {
                    updateTouchPosition(e.touches[0]);
                }
            }

            function handleModalTouchMove(e) {
                if (!mobileModalActive || !isTouching) return;
                if (e.touches.length === 1) {
                    updateTouchPosition(e.touches[0]);
                }
            }

            function handleModalTouchEnd(e) {
                if (!mobileModalActive) return;
                isTouching = false;
                if (!gyroAvailable) {
                    targetMobileRotateX = 0;
                    targetMobileRotateY = 0;
                    targetGlareX = 50;
                    targetGlareY = 50;
                }
            }

            function updateTouchPosition(touch) {
                const r = modalDialog.getBoundingClientRect();
                const x = touch.clientX - r.left;
                const y = touch.clientY - r.top;
                const hw = r.width / 2;
                const hh = r.height / 2;
                const fx = (x - hw) / hw;
                const fy = (y - hh) / hh;

                touchGlareX = (x / r.width) * 100;
                touchGlareY = (y / r.height) * 100;
                touchGlareX = Math.max(5, Math.min(95, touchGlareX));
                touchGlareY = Math.max(5, Math.min(95, touchGlareY));
                targetGlareX = touchGlareX;
                targetGlareY = touchGlareY;

                if (!gyroAvailable) {
                    touchTiltX = -fy * 18;
                    touchTiltY = fx * 18;
                    targetMobileRotateX = touchTiltX;
                    targetMobileRotateY = touchTiltY;
                }
            }

            function animateMobileTilt() {
                if (!mobileModalActive) { mobileRafId = null; return; }
                const lf = 0.14;
                currentMobileRotateX += (targetMobileRotateX - currentMobileRotateX) * lf;
                currentMobileRotateY += (targetMobileRotateY - currentMobileRotateY) * lf;
                currentGlareX += (targetGlareX - currentGlareX) * lf;
                currentGlareY += (targetGlareY - currentGlareY) * lf;

                if (Math.abs(targetMobileRotateX - currentMobileRotateX) < 0.005 && Math.abs(targetMobileRotateY -
                        currentMobileRotateY) < 0.005) {
                    currentMobileRotateX = targetMobileRotateX;
                    currentMobileRotateY = targetMobileRotateY;
                }
                if (Math.abs(targetGlareX - currentGlareX) < 0.05 && Math.abs(targetGlareY - currentGlareY) < 0.05) {
                    currentGlareX = targetGlareX;
                    currentGlareY = targetGlareY;
                }

                modalDialog.style.transform =
                    `rotateX(${currentMobileRotateX.toFixed(2)}deg) rotateY(${currentMobileRotateY.toFixed(2)}deg)`;
                modalDialog.style.setProperty('--pointer-x', `${currentGlareX.toFixed(1)}%`);
                modalDialog.style.setProperty('--pointer-y', `${currentGlareY.toFixed(1)}%`);
                modalDialog.style.setProperty('--pointer-from-left', Math.max(0, Math.min(1, currentGlareX / 100)));
                modalDialog.style.setProperty('--pointer-from-top', Math.max(0, Math.min(1, currentGlareY / 100)));
                modalDialog.style.setProperty('--glare-opacity', (isTouching || gyroAvailable) ? '0.7' : '0.25');

                mobileRafId = requestAnimationFrame(animateMobileTilt);
            }

            function handleModalMouseMove(e) {
                if (!desktopModalActive) return;
                const r = modalDialog.getBoundingClientRect();
                const x = e.clientX - r.left,
                    y = e.clientY - r.top;
                const hw = r.width / 2,
                    hh = r.height / 2;
                const fx = (x - hw) / hw,
                    fy = (y - hh) / hh;
                targetRotateX = -fy * 12;
                targetRotateY = fx * 12;
                const px = (x / r.width) * 100,
                    py = (y / r.height) * 100;
                modalDialog.style.setProperty('--pointer-x', `${Math.max(0,Math.min(100,px))}%`);
                modalDialog.style.setProperty('--pointer-y', `${Math.max(0,Math.min(100,py))}%`);
                modalDialog.style.setProperty('--pointer-from-left', Math.max(0, Math.min(1, px / 100)));
                modalDialog.style.setProperty('--pointer-from-top', Math.max(0, Math.min(1, py / 100)));
                modalDialog.style.setProperty('--glare-opacity', '0.7');
            }

            function handleModalMouseLeave() {
                if (!desktopModalActive) return;
                targetRotateX = targetRotateY = 0;
                modalDialog.style.setProperty('--pointer-x', '50%');
                modalDialog.style.setProperty('--pointer-y', '50%');
                modalDialog.style.setProperty('--pointer-from-left', '0.5');
                modalDialog.style.setProperty('--pointer-from-top', '0.5');
                modalDialog.style.setProperty('--glare-opacity', '0');
            }

            function animateModalTilt() {
                if (!desktopModalActive) { rafId = null; return; }
                const lf = 0.12;
                currentRotateX += (targetRotateX - currentRotateX) * lf;
                currentRotateY += (targetRotateY - currentRotateY) * lf;
                if (Math.abs(targetRotateX - currentRotateX) < 0.005 && Math.abs(targetRotateY - currentRotateY) <
                    0.005) {
                    currentRotateX = targetRotateX;
                    currentRotateY = targetRotateY;
                }
                modalDialog.style.transform =
                    `rotateX(${currentRotateX.toFixed(2)}deg) rotateY(${currentRotateY.toFixed(2)}deg)`;
                rafId = requestAnimationFrame(animateModalTilt);
            }

            function openModal(el) {
                if (isAnimating) return;
                isAnimating = true;
                const cfg = categoryConfig[el.cat] || categoryConfig['nonmetal'];
                const phase = getPhase(el, currentTempC);
                const pt = { solid: t('solid'), liquid: t('liquid'), gas: t('gas'), unknown: t('unknown') };
                const oxidation = getOxidation(el);
                modalHeader.innerHTML =
                    `<div class="modal-symbol-badge" style="background:${cfg.bg};color:${cfg.text}">${el.s}</div><div class="modal-element-title"><span class="modal-element-name">${getElementName(el)} (${el.s})</span><span class="modal-element-category">${getCategoryLabel(el.cat)}</span></div>`;
                modalDetails.innerHTML =
                    `<div class="modal-detail-item"><span>${t('modal_atomic')}</span><strong>${el.n}</strong></div><div class="modal-detail-item"><span>${t('modal_mass')}</span><strong>${el.mass}</strong></div><div class="modal-detail-item"><span>${t('modal_state')}</span><strong>${pt[phase]}</strong></div><div class="modal-detail-item"><span>${t('modal_melt')}</span><strong>${el.melt?(el.melt-ZERO_KELVIN).toFixed(1)+'°C':t('unknown')}</strong></div><div class="modal-detail-item"><span>${t('modal_boil')}</span><strong>${el.boil?(el.boil-ZERO_KELVIN).toFixed(1)+'°C':t('unknown')}</strong></div><div class="modal-detail-item"><span>${t('modal_en')}</span><strong>${el.en}</strong></div><div class="modal-detail-item"><span>${t('modal_radius')}</span><strong>${el.radius?el.radius+' pm':t('unknown')}</strong></div><div class="modal-detail-item"><span>${t('modal_density')}</span><strong>${el.density?el.density+' g/cm³':t('unknown')}</strong></div><div class="modal-detail-item"><span>${t('modal_year')}</span><strong>${el.year?el.year:t('unknown')}</strong></div><div class="modal-detail-item"><span>${t('modal_oxidation')}</span><strong>${oxidation}</strong></div>`;
                modalElectronConfig.innerHTML =
                    `<span style="font-weight:600;font-size:0.6rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.04em;">${t('modal_config')}</span> ${formatEC(el.ec)}`;
                atomContainer.innerHTML = generateAtomSVG(el);

                currentRotateX = currentRotateY = targetRotateX = targetRotateY = 0;
                currentMobileRotateX = currentMobileRotateY = targetMobileRotateX = targetMobileRotateY = 0;
                currentGlareX = currentGlareY = targetGlareX = targetGlareY = 50;
                touchGlareX = touchGlareY = 50;
                touchTiltX = touchTiltY = 0;
                isTouching = false;
                gyroBeta0 = gyroGamma0 = null;
                gyroAvailable = false;
                needGyroCalibration = false;
                lastScreenOrientation = null;
                modalDialog.style.transform = 'rotateX(0deg) rotateY(0deg)';
                ['--pointer-x', '--pointer-y'].forEach(v => modalDialog.style.setProperty(v, '50%'));
                modalDialog.style.setProperty('--pointer-from-left', '0.5');
                modalDialog.style.setProperty('--pointer-from-top', '0.5');
                modalDialog.style.setProperty('--glare-opacity', '0');

                modalOverlay.classList.add('active');
                modalDialog.classList.add('bouncing-in');
                modalOverlay.setAttribute('aria-hidden', 'false');
                document.body.style.overflow = 'hidden';

                const onEnd = () => {
                    modalDialog.removeEventListener('animationend', onEnd);
                    modalDialog.classList.remove('bouncing-in');
                    isAnimating = false;
                    modalClose.focus();
                };
                modalDialog.addEventListener('animationend', onEnd, { once: true });
                setTimeout(() => { if (isAnimating) onEnd(); }, 600);

                modalDialog.removeEventListener('mousemove', handleModalMouseMove);
                modalDialog.removeEventListener('mouseleave', handleModalMouseLeave);
                modalOverlay.removeEventListener('touchstart', handleModalTouchStart);
                modalOverlay.removeEventListener('touchmove', handleModalTouchMove);
                modalOverlay.removeEventListener('touchend', handleModalTouchEnd);
                modalOverlay.removeEventListener('touchcancel', handleModalTouchEnd);
                if (rafId) { cancelAnimationFrame(rafId);
                    rafId = null; }
                if (mobileRafId) { cancelAnimationFrame(mobileRafId);
                    mobileRafId = null; }

                if (!isMobile()) {
                    desktopModalActive = true;
                    mobileModalActive = false;
                    modalDialog.addEventListener('mousemove', handleModalMouseMove);
                    modalDialog.addEventListener('mouseleave', handleModalMouseLeave);
                    rafId = requestAnimationFrame(animateModalTilt);
                } else {
                    desktopModalActive = false;
                    mobileModalActive = true;
                    needGyroCalibration = true;
                    modalOverlay.addEventListener('touchstart', handleModalTouchStart, { passive: true });
                    modalOverlay.addEventListener('touchmove', handleModalTouchMove, { passive: true });
                    modalOverlay.addEventListener('touchend', handleModalTouchEnd, { passive: true });
                    modalOverlay.addEventListener('touchcancel', handleModalTouchEnd, { passive: true });
                    mobileRafId = requestAnimationFrame(animateMobileTilt);
                    if (!gyroActive) enableGyro();
                }
            }

            function closeModal() {
                if (isAnimating) return;
                isAnimating = true;
                modalOverlay.classList.remove('active');
                modalOverlay.setAttribute('aria-hidden', 'true');
                modalDialog.classList.remove('bouncing-in');
                document.body.style.overflow = '';

                desktopModalActive = false;
                mobileModalActive = false;
                isTouching = false;
                if (rafId) { cancelAnimationFrame(rafId);
                    rafId = null; }
                if (mobileRafId) { cancelAnimationFrame(mobileRafId);
                    mobileRafId = null; }
                modalDialog.removeEventListener('mousemove', handleModalMouseMove);
                modalDialog.removeEventListener('mouseleave', handleModalMouseLeave);
                modalOverlay.removeEventListener('touchstart', handleModalTouchStart);
                modalOverlay.removeEventListener('touchmove', handleModalTouchMove);
                modalOverlay.removeEventListener('touchend', handleModalTouchEnd);
                modalOverlay.removeEventListener('touchcancel', handleModalTouchEnd);

                currentRotateX = currentRotateY = targetRotateX = targetRotateY = 0;
                currentMobileRotateX = currentMobileRotateY = targetMobileRotateX = targetMobileRotateY = 0;
                currentGlareX = currentGlareY = targetGlareX = targetGlareY = 50;
                gyroBeta0 = gyroGamma0 = null;
                gyroAvailable = false;
                needGyroCalibration = false;
                lastScreenOrientation = null;
                modalDialog.style.transform = 'rotateX(0deg) rotateY(0deg)';
                ['--pointer-x', '--pointer-y'].forEach(v => modalDialog.style.setProperty(v, '50%'));
                modalDialog.style.setProperty('--pointer-from-left', '0.5');
                modalDialog.style.setProperty('--pointer-from-top', '0.5');
                modalDialog.style.setProperty('--glare-opacity', '0');

                isAnimating = false;
                if (lastClickedCard) lastClickedCard.focus();
            }

            function generateAtomSVG(el) {
                const shells = getElectronShells(el.n);
                const color = (categoryConfig[el.cat] || categoryConfig['nonmetal']).text || '#3a528b';
                const br = 75,
                    st = 55;
                const mr = br + shells.length * st;
                const ss = mr + 40;
                let o = '';
                shells.forEach((c, i) => {
                    const r = br + i * st;
                    const oc = `orbit orbit-${i+1}`;
                    let e = '';
                    if (c > 0) {
                        const as = 360 / c;
                        for (let j = 0; j < c; j++) {
                            const a = j * as * Math.PI / 180;
                            const cx = r * Math.cos(a),
                                cy = r * Math.sin(a);
                            e +=
                                `<circle cx="${cx.toFixed(2)}" cy="${cy.toFixed(2)}" r="${Math.max(6, 10 - i * 0.6)}" fill="${color}" />`;
                        }
                    }
                    o +=
                        `<g class="${oc}"><circle cx="0" cy="0" r="${r}" fill="none" stroke="${color}" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>${e}</g>`;
                });
                return `<svg class="atom-svg" viewBox="${-ss} ${-ss} ${ss*2} ${ss*2}"><circle cx="0" cy="0" r="40" fill="${color}" opacity="0.1"/><circle cx="0" cy="0" r="40" fill="none" stroke="${color}" stroke-width="3"/><text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-size="28" font-weight="700" fill="${color}">${el.s}</text>${o}</svg>`;
            }

            function getElectronShells(an) {
                const order = [{ n: 1, l: 's', cap: 2 }, { n: 2, l: 's', cap: 2 }, { n: 2, l: 'p', cap: 6 }, { n: 3, l: 's',
                    cap: 2 }, { n: 3, l: 'p', cap: 6 }, { n: 4, l: 's', cap: 2 }, { n: 3, l: 'd', cap: 10 }, { n: 4,
                    l: 'p', cap: 6 }, { n: 5, l: 's', cap: 2 }, { n: 4, l: 'd', cap: 10 }, { n: 5, l: 'p', cap: 6 }, { n: 6,
                    l: 's', cap: 2 }, { n: 4, l: 'f', cap: 14 }, { n: 5, l: 'd', cap: 10 }, { n: 6, l: 'p', cap: 6 }, { n: 7,
                    l: 's', cap: 2 }, { n: 5, l: 'f', cap: 14 }, { n: 6, l: 'd', cap: 10 }, { n: 7, l: 'p', cap: 6 }];
                let r = an;
                const s = [0, 0, 0, 0, 0, 0, 0];
                for (let o of order) {
                    if (r <= 0) break;
                    const f = Math.min(o.cap, r);
                    s[o.n - 1] += f;
                    r -= f;
                }
                while (s.length > 0 && s[s.length - 1] === 0) s.pop();
                return s;
            }

            function updateTempDisplay() {
                const c = getTemperatureColor(currentTempC);
                tempValueMain.innerHTML = `<span style="color:${c}">${currentTempC}</span>°C`;
                tempValueSub.innerHTML = `<span style="color:${c}">${(currentTempC + ZERO_KELVIN).toFixed(0)}</span> K`;
                updateThermometer(currentTempC);
                updateSliderThumb(currentTempC);
            }

            function updateTheme(th) {
                currentTheme = th;
                document.documentElement.setAttribute('data-theme', th === 'dark' ? 'dark' : '');
                document.getElementById('themeToggle').textContent = th === 'dark' ? '☀️' : '🌙';
                if (phaseColorMode) applyCardStyles();
            }

            function init() {
                updateTheme('light');
                updateTempDisplay();
                buildTable();
                requestAnimationFrame(() => updateSlider());
                window.addEventListener('resize', () => { requestAnimationFrame(updateSlider); });
                phaseColorToggle.addEventListener('click', () => {
                    phaseColorMode = !phaseColorMode;
                    phaseColorToggle.classList.toggle('active', phaseColorMode);
                    applyCardStyles();
                });
                tempSlider.addEventListener('input', () => {
                    currentTempC = parseInt(tempSlider.value);
                    updateTempDisplay();
                    applyCardStyles();
                });
                document.getElementById('btnAbsoluteZero').addEventListener('click', () => {
                    currentTempC = -273;
                    tempSlider.value = currentTempC;
                    updateTempDisplay();
                    applyCardStyles();
                });
                document.getElementById('btnRoomTemp').addEventListener('click', () => {
                    currentTempC = 25;
                    tempSlider.value = currentTempC;
                    updateTempDisplay();
                    applyCardStyles();
                });
                document.getElementById('btnResetTemp').addEventListener('click', () => {
                    currentTempC = 25;
                    tempSlider.value = currentTempC;
                    updateTempDisplay();
                    applyCardStyles();
                });
                document.querySelectorAll('.lang-btn').forEach(b => {
                    b.addEventListener('click', () => { switchLang(b.dataset.lang); });
                });
                document.getElementById('themeToggle').addEventListener('click', () => {
                    updateTheme(currentTheme === 'light' ? 'dark' : 'light');
                });
                modalClose.addEventListener('click', closeModal);
                modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
                document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modalOverlay.classList.contains(
                        'active')) closeModal(); });
                const searchInput = document.getElementById('searchInput');
                const searchClear = document.getElementById('searchClear');
                const resultsCount = document.getElementById('resultsCount');
                searchInput.addEventListener('input', () => {
                    const q = searchInput.value.trim().toLowerCase();
                    if (!q && !activeCategory) {
                        allElementCards.forEach(c => c.classList.remove('dimmed', 'highlighted'));
                        searchClear.classList.remove('visible');
                        resultsCount.classList.remove('visible');
                        return;
                    }
                    searchClear.classList.toggle('visible', !!q);
                    let cnt = 0;
                    allElementCards.forEach(c => {
                        const nm = c.dataset.name.toLowerCase(),
                            sy = c.dataset.symbol.toLowerCase(),
                            nu = c.dataset.atomicNumber;
                        const m = !q || nm.includes(q) || sy.includes(q) || nu === q;
                        const ok = !activeCategory || c.dataset.category === activeCategory;
                        const sh = m && ok;
                        c.classList.toggle('dimmed', !sh);
                        c.classList.toggle('highlighted', sh && !!activeCategory);
                        if (sh) cnt++;
                    });
                    resultsCount.textContent = t('search_count', { n: cnt });
                    resultsCount.classList.toggle('visible', !!(q || activeCategory));
                });
                searchClear.addEventListener('click', () => {
                    searchInput.value = '';
                    searchInput.dispatchEvent(new Event('input'));
                    searchInput.focus();
                });
            }
            init();
        })();
    </script>
</body>
</html>
